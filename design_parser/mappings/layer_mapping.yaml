# ===================== CSV 域值校验 =====================
csv_validation:
  - csv_file: "l_cable_type.csv"
    target_layer: "CABLE"
    target_field: "TYPE_CABLE"
  - csv_file: "l_fibre_type.csv"
    target_layer: "CABLE"
    target_field: "TYPE_FIBRE"
  - csv_file: "l_statut.csv"
    target_layer: "*"
    target_field: "STATUT"
  - csv_file: "Type boite.csv"
    target_layer: "BOITE"
    target_field: "TYPE"
  - csv_file: "l_ptc_type.csv"
    target_layer: "PTECH"
    target_field: "TYPE"

# ===================== 容差配置 =====================
tolerances:
  endpoint_on_device: 0.5   # 米
  isolated_endpoint: 100.0  # 米
  min_object_distance: 0.5  # 米
  cable_device_match: 0.5   # 米
